[project]
name = "reaper-mcp"
version = "0.1.0"
description = "Small MCP server for Cockos REAPER: 11 grouped tools, file IPC, no 180-tool dump."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yiw190" }]
keywords = ["reaper", "mcp", "daw", "reascript"]
dependencies = []

[project.urls]
Homepage = "https://github.com/yiw190/reaper-mcp"
Repository = "https://github.com/yiw190/reaper-mcp"

[project.scripts]
reaper-mcp = "reaper_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reaper_mcp"]
